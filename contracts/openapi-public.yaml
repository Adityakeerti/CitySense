openapi: 3.0.1
info:
  title: CitySense Public API
  description: Spring Boot core gateway. Clients never call the AI service directly.
  version: 0.1.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
paths:
  /internal/observations:
    post:
      tags:
      - Internal
      summary: ai-service pushes observations (e.g. cv_density) here
      operationId: ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IngestResponse"
      security:
      - internalKey: []
  /internal/actions:
    post:
      tags:
      - Internal
      operationId: propose
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActionView"
      security:
      - internalKey: []
  /api/scenarios/{name}:
    post:
      tags:
      - Scenarios
      summary: Inject a demo scenario; all observations are labelled SIMULATED
      operationId: inject
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestResponse"
  /api/events:
    get:
      tags:
      - Observations
      summary: "Most recent observations, optionally filtered by type"
      operationId: recent
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - cv_density
          - complaint
          - flood
          - crash
          - event
          - agent_finding
          - rain
          - congestion
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObservationView"
    post:
      tags:
      - Observations
      summary: Inject an observation (dashboard / crew)
      operationId: inject_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /api/auth/register:
    post:
      tags:
      - Auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/actions:
    get:
      tags:
      - Approvals
      operationId: list_3
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - AUTO_EXECUTED
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionView"
    post:
      tags:
      - Approvals
      operationId: propose_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActionView"
  /api/actions/{id}/reject:
    post:
      tags:
      - Approvals
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActionView"
  /api/actions/{id}/approve:
    post:
      tags:
      - Approvals
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActionView"
  /api/incidents/{id}/status:
    patch:
      tags:
      - Incidents
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChange"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentView"
  /api/scenarios:
    get:
      tags:
      - Scenarios
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
  /api/map/features:
    get:
      tags:
      - Map
      summary: Active incidents and recent observations as a GeoJSON FeatureCollection
      operationId: features
      parameters:
      - name: observationLimit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/incidents:
    get:
      tags:
      - Incidents
      operationId: list_1
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentView"
  /api/incidents/{id}:
    get:
      tags:
      - Incidents
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentDetail"
  /api/auth/me:
    get:
      tags:
      - Auth
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
  /api/audit:
    get:
      tags:
      - Audit
      operationId: list_2
      parameters:
      - name: entityType
        in: query
        required: false
        schema:
          type: string
      - name: entityId
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageAuditLog"
components:
  schemas:
    ObservationRequest:
      required:
      - latitude
      - longitude
      - type
      type: object
      properties:
        type:
          type: string
          enum:
          - cv_density
          - complaint
          - flood
          - crash
          - event
          - agent_finding
          - rain
          - congestion
        latitude:
          maximum: 90
          exclusiveMaximum: false
          minimum: -90
          exclusiveMinimum: false
          type: number
          format: double
        longitude:
          maximum: 180
          exclusiveMaximum: false
          minimum: -180
          exclusiveMinimum: false
          type: number
          format: double
        observedAt:
          type: string
          format: date-time
        source:
          maxLength: 64
          minLength: 0
          type: string
        confidence:
          maximum: 1
          exclusiveMaximum: false
          minimum: 0
          exclusiveMinimum: false
          type: number
          format: double
        status:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - SIMULATED
          - PREDICTED
          - STALE
        payload:
          type: object
          additionalProperties:
            type: object
    IngestResponse:
      type: object
      properties:
        observation:
          $ref: "#/components/schemas/ObservationView"
        incidentId:
          type: string
          format: uuid
        newIncident:
          type: boolean
    ObservationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - cv_density
          - complaint
          - flood
          - crash
          - event
          - agent_finding
          - rain
          - congestion
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        observedAt:
          type: string
          format: date-time
        source:
          type: string
        confidence:
          type: number
          format: double
        status:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - SIMULATED
          - PREDICTED
          - STALE
        payload:
          type: object
          additionalProperties:
            type: object
        incidentId:
          type: string
          format: uuid
    ProposeRequest:
      required:
      - actionType
      - agent
      type: object
      properties:
        incidentId:
          type: string
          format: uuid
        agent:
          maxLength: 64
          minLength: 0
          type: string
        actionType:
          type: string
          enum:
          - NOTIFY_CITIZENS
          - SIGNAL_OVERRIDE
          - ROAD_CLOSURE
          - DISPATCH
          - EVACUATION
          - GREEN_CORRIDOR
        riskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        summary:
          maxLength: 2000
          minLength: 0
          type: string
        payload:
          type: object
          additionalProperties:
            type: object
    ActionView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        agent:
          type: string
        actionType:
          type: string
          enum:
          - NOTIFY_CITIZENS
          - SIGNAL_OVERRIDE
          - ROAD_CLOSURE
          - DISPATCH
          - EVACUATION
          - GREEN_CORRIDOR
        summary:
          type: string
        payload:
          type: object
          additionalProperties:
            type: object
        riskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        approvalStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - AUTO_EXECUTED
        decidedBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        decisionReason:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      required:
      - email
      - fullName
      - password
      type: object
      properties:
        email:
          type: string
        password:
          maxLength: 72
          minLength: 8
          type: string
        fullName:
          maxLength: 120
          minLength: 0
          type: string
        language:
          pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          type: string
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserView"
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - CITIZEN
          - ADMIN
          - CREW
        language:
          type: string
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    RejectRequest:
      required:
      - reason
      type: object
      properties:
        reason:
          maxLength: 2000
          minLength: 0
          type: string
    DecisionRequest:
      type: object
      properties:
        reason:
          maxLength: 2000
          minLength: 0
          type: string
    StatusChange:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
    IncidentView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - cv_density
          - complaint
          - flood
          - crash
          - event
          - agent_finding
          - rain
          - congestion
        title:
          type: string
        summary:
          type: string
        severity:
          type: integer
          format: int32
        urgencyScore:
          type: number
          format: double
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
        observationCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IncidentDetail:
      type: object
      properties:
        incident:
          $ref: "#/components/schemas/IncidentView"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationView"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionView"
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        outcome:
          type: string
        evidence:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: string
          format: date-time
    PageAuditLog:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        number:
          type: integer
          format: int32
        sort:
          type: array
          items:
            $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          type: array
          items:
            $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        direction:
          type: string
        nullHandling:
          type: string
        ascending:
          type: boolean
        property:
          type: string
        ignoreCase:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalKey:
      type: apiKey
      name: X-Internal-Key
      in: header
